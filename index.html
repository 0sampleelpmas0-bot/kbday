<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>for you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Fraunces:ital,opsz,wght@1,9..144,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF3EE;
    --cream-deep:#F3E6DC;
    --rose:#E8B4B8;
    --rose-deep:#D89AA0;
    --sage:#8A9A7E;
    --brown:#4A3B3B;
    --brown-soft:#7A6A63;
    --gold:#C9A063;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    height:100%;
    background:var(--cream);
    color:var(--brown);
    font-family:'Jost',sans-serif;
    overflow:hidden;
  }

  .screen{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    opacity:0;
    visibility:hidden;
    transition:opacity 1s ease;
    padding:24px;
    text-align:center;
  }

  .screen.active{
    opacity:1;
    visibility:visible;
  }

  /* ---------- ambient background blobs ---------- */
  /* (legacy .blob rules removed — replaced by #ambient fluid layer above) */

  /* ---------- continuous fluid background (runs everywhere, always, never resets) ---------- */
  #ambient{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    overflow:hidden;
  }
  #ambient .fluid{
    position:absolute;
    filter:blur(70px);
    mix-blend-mode:multiply;
    will-change:transform, border-radius;
  }
  #ambient .f1{
    width:60vw;height:60vw;
    max-width:620px;max-height:620px;
    background:var(--rose);
    opacity:0.4;
    top:-15%;left:-15%;
    animation:morph1 26s ease-in-out infinite;
  }
  #ambient .f2{
    width:55vw;height:55vw;
    max-width:560px;max-height:560px;
    background:var(--sage);
    opacity:0.3;
    bottom:-18%;right:-12%;
    animation:morph2 32s ease-in-out infinite;
  }
  #ambient .f3{
    width:40vw;height:40vw;
    max-width:420px;max-height:420px;
    background:var(--gold);
    opacity:0.22;
    top:35%;right:15%;
    animation:morph3 22s ease-in-out infinite;
  }
  #ambient .f4{
    width:35vw;height:35vw;
    max-width:360px;max-height:360px;
    background:var(--rose-deep);
    opacity:0.2;
    bottom:10%;left:10%;
    animation:morph1 29s ease-in-out infinite reverse;
  }

  @keyframes morph1{
    0%{
      border-radius:42% 58% 65% 35% / 45% 40% 60% 55%;
      transform:translate(0,0) rotate(0deg) scale(1);
    }
    33%{
      border-radius:60% 40% 35% 65% / 55% 65% 35% 45%;
      transform:translate(4vw,3vh) rotate(8deg) scale(1.08);
    }
    66%{
      border-radius:35% 65% 55% 45% / 40% 50% 50% 60%;
      transform:translate(-3vw,4vh) rotate(-6deg) scale(0.96);
    }
    100%{
      border-radius:42% 58% 65% 35% / 45% 40% 60% 55%;
      transform:translate(0,0) rotate(0deg) scale(1);
    }
  }

  @keyframes morph2{
    0%{
      border-radius:55% 45% 40% 60% / 50% 55% 45% 50%;
      transform:translate(0,0) rotate(0deg) scale(1);
    }
    40%{
      border-radius:40% 60% 55% 45% / 60% 40% 60% 40%;
      transform:translate(-4vw,-3vh) rotate(-10deg) scale(1.1);
    }
    70%{
      border-radius:60% 40% 45% 55% / 45% 55% 45% 55%;
      transform:translate(3vw,-4vh) rotate(6deg) scale(0.94);
    }
    100%{
      border-radius:55% 45% 40% 60% / 50% 55% 45% 50%;
      transform:translate(0,0) rotate(0deg) scale(1);
    }
  }

  @keyframes morph3{
    0%{
      border-radius:50% 50% 40% 60% / 40% 60% 40% 60%;
      transform:translate(0,0) scale(1);
    }
    50%{
      border-radius:35% 65% 60% 40% / 65% 35% 65% 35%;
      transform:translate(-3vw,3vh) scale(1.12);
    }
    100%{
      border-radius:50% 50% 40% 60% / 40% 60% 40% 60%;
      transform:translate(0,0) scale(1);
    }
  }

  @media (prefers-reduced-motion: reduce){
    #ambient .fluid{animation:none;}
  }

  /* ================= PASSCODE SCREEN ================= */
  #gate .seal{
    width:88px;
    height:88px;
    border-radius:50%;
    border:1.5px solid var(--rose-deep);
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 28px;
    position:relative;
    z-index:1;
    transition:transform .6s ease, opacity .6s ease;
  }
  #gate .seal svg{width:34px;height:34px;stroke:var(--rose-deep);}

  #gate .seal.unlocking{
    transform:scale(1.15) rotate(8deg);
    opacity:0;
  }

  #gate .prompt{
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(20px,3vw,26px);
    font-style:italic;
    color:var(--brown);
    margin-bottom:22px;
    max-width:420px;
    z-index:1;
    line-height:1.5;
  }

  #gate .input-row{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
    z-index:1;
  }

  #gate input{
    width:min(280px,80vw);
    padding:12px 18px;
    text-align:center;
    border:none;
    border-bottom:1.5px solid var(--rose-deep);
    background:transparent;
    font-family:'Jost',sans-serif;
    font-size:16px;
    letter-spacing:0.5px;
    color:var(--brown);
    outline:none;
    transition:border-color .3s ease;
  }
  #gate input::placeholder{color:var(--brown-soft);opacity:0.5;}
  #gate input:focus{border-color:var(--sage);}

  #gate button{
    padding:10px 32px;
    border:1px solid var(--rose-deep);
    background:transparent;
    border-radius:30px;
    color:var(--brown);
    font-family:'Jost',sans-serif;
    font-size:13px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    cursor:pointer;
    transition:all .35s ease;
  }
  #gate button:hover{
    background:var(--rose);
    border-color:var(--rose);
    color:#fff;
  }
  #gate button:focus-visible, #gate input:focus-visible{
    outline:2px solid var(--sage);
    outline-offset:3px;
  }

  #gate .shake{
    animation:shake .5s ease;
  }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-8px);}
    40%{transform:translateX(8px);}
    60%{transform:translateX(-6px);}
    80%{transform:translateX(6px);}
  }

  #gate .hint{
    margin-top:14px;
    font-size:12px;
    color:var(--brown-soft);
    opacity:0;
    height:16px;
    transition:opacity .3s ease;
    z-index:1;
  }
  #gate .hint.show{opacity:0.75;}

  /* ================= COUNTDOWN SCREEN ================= */
  #countdown .eyebrow{
    font-size:12px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--sage);
    margin-bottom:18px;
    z-index:1;
  }

  #countdown .countdown-row{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:clamp(10px,2.5vw,28px);
    z-index:1;
    flex-wrap:wrap;
  }

  #countdown .ctime-block{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-width:70px;
  }

  #countdown .ctime-number{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-size:clamp(52px,11vw,110px);
    line-height:0.9;
    color:var(--brown);
    font-variant-numeric:tabular-nums;
  }

  #countdown .ctime-label{
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(13px,1.6vw,16px);
    color:var(--brown-soft);
    margin-top:6px;
    letter-spacing:1px;
    text-transform:uppercase;
  }

  #countdown .ctime-sep{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-size:clamp(36px,7vw,64px);
    color:var(--rose-deep);
    opacity:0.5;
    transform:translateY(-6px);
  }

  @media (max-width:420px){
    #countdown .ctime-sep{display:none;}
  }

  #countdown .kiss-note{
    margin-top:48px;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:15px;
    color:var(--rose-deep);
    letter-spacing:0.3px;
    z-index:1;
    opacity:0.85;
  }

  /* ================= FULL SITE PLACEHOLDER (birthday) ================= */
  #fullsite .title{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-size:clamp(36px,6vw,64px);
    z-index:1;
  }
  #fullsite .sub{
    font-family:'Cormorant Garamond',serif;
    font-size:18px;
    color:var(--brown-soft);
    margin-top:14px;
    z-index:1;
  }
</style>
</head>
<body>

  <!-- constant soothing fluid background, sits behind every screen, never resets -->
  <div id="ambient">
    <div class="fluid f1"></div>
    <div class="fluid f2"></div>
    <div class="fluid f3"></div>
    <div class="fluid f4"></div>
  </div>

  <!-- ============ SCREEN 0: PASSCODE GATE ============ -->
  <section id="gate" class="screen active">

    <div class="seal" id="seal">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="10" width="16" height="10" rx="1.5"></rect>
        <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
      </svg>
    </div>

    <!-- PLACEHOLDER: swap this question + the answer check in the script below -->
    <p class="prompt">Kiski timing kharab h?</p>

    <div class="input-row">
      <input type="text" id="passInput" placeholder="type your answer" autocomplete="off" />
      <button id="unlockBtn">Unlock</button>
      <div class="hint" id="hint">hayeeeeeeeeeeeee</div>
    </div>
  </section>

  <!-- ============ SCREEN 1: COUNTDOWN ============ -->
  <section id="countdown" class="screen">

    <div class="eyebrow">until my favourite person's birthday</div>
    <div class="countdown-row">
      <div class="ctime-block">
        <div class="ctime-number" id="cdDays">--</div>
        <div class="ctime-label">days</div>
      </div>
      <div class="ctime-sep">:</div>
      <div class="ctime-block">
        <div class="ctime-number" id="cdHours">--</div>
        <div class="ctime-label">hours</div>
      </div>
      <div class="ctime-sep">:</div>
      <div class="ctime-block">
        <div class="ctime-number" id="cdMinutes">--</div>
        <div class="ctime-label">minutes</div>
      </div>
    </div>
    <div class="kiss-note">still waiting for that kiss btw</div>
  </section>

  <!-- ============ SCREEN 2: FULL SITE (birthday placeholder) ============ -->
  <section id="fullsite" class="screen">

    <div class="title">happy birthday</div>
    <div class="sub">the rest of the surprise is on its way &mdash; check back soon</div>
  </section>

<script>
  // ============================================================
  // CONFIG — edit these two things
  // ============================================================
  const PASSCODE_ANSWER = "dev";        // <-- placeholder answer, change to your inside joke
  const BIRTHDAY_MONTH = 8;               // August
  const BIRTHDAY_DAY = 8;                 // 8th
  // ============================================================

  const gate = document.getElementById('gate');
  const countdownScreen = document.getElementById('countdown');
  const fullsiteScreen = document.getElementById('fullsite');

  const seal = document.getElementById('seal');
  const passInput = document.getElementById('passInput');
  const unlockBtn = document.getElementById('unlockBtn');
  const hint = document.getElementById('hint');

  let countdownTimer = null;

  function isBirthdayToday(){
    const now = new Date();
    return now.getMonth() + 1 === BIRTHDAY_MONTH && now.getDate() === BIRTHDAY_DAY;
  }

  function msUntilBirthday(){
    const now = new Date();
    const year = now.getFullYear();
    let target = new Date(year, BIRTHDAY_MONTH - 1, BIRTHDAY_DAY, 0, 0, 0);
    if (target <= now) {
      target = new Date(year + 1, BIRTHDAY_MONTH - 1, BIRTHDAY_DAY, 0, 0, 0);
    }
    return target - now;
  }

  function updateCountdown(){
    const diff = msUntilBirthday();
    const totalMinutes = Math.floor(diff / (1000 * 60));
    const days = Math.floor(totalMinutes / (60 * 24));
    const hours = Math.floor((totalMinutes % (60 * 24)) / 60);
    const minutes = totalMinutes % 60;

    document.getElementById('cdDays').textContent = days;
    document.getElementById('cdHours').textContent = String(hours).padStart(2, '0');
    document.getElementById('cdMinutes').textContent = String(minutes).padStart(2, '0');

    // if we've just crossed into her birthday while the page is open, flip screens
    if (isBirthdayToday()){
      clearInterval(countdownTimer);
      showScreen(fullsiteScreen);
    }
  }

  // fluid background is pure CSS (see #ambient .fluid), runs continuously
  // and never resets across screen transitions — nothing to init in JS.

  function showScreen(el){
    [gate, countdownScreen, fullsiteScreen].forEach(s => s.classList.remove('active'));
    el.classList.add('active');
  }

  function proceedPastGate(){
    seal.classList.add('unlocking');
    setTimeout(() => {
      if (isBirthdayToday()){
        showScreen(fullsiteScreen);
      } else {
        updateCountdown();
        showScreen(countdownScreen);
        // tick every second so hours/minutes stay live
        countdownTimer = setInterval(updateCountdown, 1000);
      }
    }, 500);
  }

  function tryUnlock(){
    const val = passInput.value.trim().toLowerCase();
    if (val === PASSCODE_ANSWER.toLowerCase()){
      proceedPastGate();
    } else {
      gate.querySelector('.input-row').classList.remove('shake');
      void gate.offsetWidth; // restart animation
      gate.querySelector('.input-row').classList.add('shake');
      hint.classList.add('show');
      setTimeout(() => hint.classList.remove('show'), 1800);
    }
  }

  unlockBtn.addEventListener('click', tryUnlock);
  passInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') tryUnlock();
  });
</script>
</body>
</html>
